<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bulk Ledger Editor · PumpAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/theme.css">
<style>
  /* Premium Data Grid Stylings */
  .bulk-table-wrap {
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    overflow: auto;
    background: var(--bg-elev);
    max-height: calc(100vh - 260px);
    box-shadow: var(--shadow-sm);
    position: relative;
  }
  
  .bulk-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  
  .bulk-table th {
    text-align: left;
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    padding: 12px 16px;
    background: var(--bg-sunken);
    border-bottom: 1px solid var(--border-strong);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  
  .bulk-table td {
    padding: 0;
    border-bottom: 1px solid var(--border-soft);
    color: var(--ink);
    vertical-align: middle;
  }
  
  .bulk-table tr:hover td {
    background: var(--bg-soft);
  }
  
  /* Dirty row highlights with soft blue accent indicator */
  .bulk-table tr.dirty {
    background: var(--info-bg) !important;
  }
  
  .bulk-table tr.dirty td:first-child {
    position: relative;
  }
  
  .bulk-table tr.dirty td:first-child::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: var(--info);
    z-index: 5;
  }
  
  /* Input element formatting to match seamless sheet grids */
  .grid-input {
    width: 100%;
    height: 100%;
    padding: 12px 16px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 13.5px;
    outline: none;
    transition: all 120ms ease;
  }
  
  .grid-input.mono {
    font-family: var(--font-mono);
    font-size: 12.5px;
  }
  
  .grid-input:focus {
    background: var(--bg-elev);
    border-color: var(--info);
    box-shadow: inset 0 0 0 1px var(--info);
    color: var(--ink) !important;
  }
  
  .bulk-table tr.dirty .grid-input {
    color: #2b4c7e; /* high-contrast soft blue text */
  }
  
  .dirty-badge-container {
    display: flex;
    align-items: center;
    gap: 8px;
  }
</style>
</head>
<body>
<main class="main" id="main"></main>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/party-ac.js"></script>
<script>
// State cache for loaded ledger rows
let originalRows = [];
let editedRows = {}; // entry_id -> updated record fields
const FIELDS = ['date', 'party_name', 'vehicle_wheel_no', 'amount', 'type', 'remarks'];

function render() {
  const actionsHtml = `
    <div class="dirty-badge-container">
      <span class="badge info hide" id="dirty-pill"><span class="dot"></span><span id="dirty-count">0</span> changes pending</span>
      <button class="btn btn-accent" id="btn-commit" disabled>Commit Global Changes 💾</button>
    </div>
  `;

  document.getElementById('main').innerHTML = `
    ${UI.pageHead({
      crumb: 'Workspace',
      title: 'Bulk Ledger Editor',
      desc: 'Modify, filter, and audit detailed customer credits and office expenses across multiple dates at once inside a high-speed inline data grid.',
      actions: actionsHtml
    })}

    <div class="card mb-3 no-print">
      <div class="card-title">
        <h3>Filter Transactions</h3>
      </div>
      <div class="grid grid-4" style="align-items: end;">
        <div class="field" style="margin-bottom:0;">
          <label>Start Date</label>
          <input class="input mono" type="date" id="start-date" required>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>End Date</label>
          <input class="input mono" type="date" id="end-date" required>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>Client-Side Filtration (Real-Time)</label>
          <input class="input" type="text" id="grid-search" placeholder="Type party, vehicle, type, remarks...">
        </div>
        <div>
          <button class="btn btn-primary" id="btn-fetch" style="width: 100%; justify-content: center;">Fetch Transactions 🔍</button>
        </div>
      </div>
    </div>

    <div class="card" id="grid-card" style="padding:0; overflow:hidden;">
      <div class="bulk-table-wrap">
        <table class="bulk-table" id="matrix-table">
          <thead>
            <tr>
              <th style="width: 130px;">Date</th>
              <th style="width: 200px;">Customer / Account Head</th>
              <th style="width: 150px;">Vehicle / License Plate</th>
              <th style="width: 130px; text-align: right;">Amount (INR)</th>
              <th style="width: 120px;">Type</th>
              <th>Remarks / Description</th>
            </tr>
          </thead>
          <tbody id="matrix-tbody">
            <!-- Loaded dynamically -->
          </tbody>
        </table>
      </div>
    </div>
  `;

  // Bind primary controller event listeners
  document.getElementById('btn-fetch').onclick = fetchLedgerData;
  document.getElementById('grid-search').oninput = applyClientFilter;
  document.getElementById('btn-commit').onclick = commitGlobalChanges;

  // Initialize dates: defaults to the start of this month to today
  const today = new Date();
  const year = today.getFullYear();
  const month = String(today.getMonth() + 1).padStart(2, '0');
  const startDay = '01';
  const endDay = String(today.getDate()).padStart(2, '0');
  
  document.getElementById('start-date').value = `${year}-${month}-${startDay}`;
  document.getElementById('end-date').value = `${year}-${month}-${endDay}`;
  
  // Initial load
  fetchLedgerData();
}

async function fetchLedgerData() {
  const start = document.getElementById('start-date').value;
  const end = document.getElementById('end-date').value;
  
  if (!start || !end) {
    UI.toast('Please select both start and end dates', 'bad');
    return;
  }
  
  const fetchBtn = document.getElementById('btn-fetch');
  fetchBtn.disabled = true;
  fetchBtn.textContent = 'Loading... ⏳';
  
  try {
    const res = await fetch(`http://127.0.0.1:8000/api/ledger/bulk-fetch?start_date=${start}&end_date=${end}`);
    if (!res.ok) throw new Error('Fetch request failed');
    const data = await res.json();
    
    originalRows = data;
    editedRows = {};
    updateDirtyUI();
    
    renderGridRows(data);
    UI.toast(`Loaded ${data.length} transactions successfully.`, 'ok');
  } catch (err) {
    console.error(err);
    UI.toast('Database read failed or server unreachable.', 'bad');
    
    // Render offline empty fallback
    document.getElementById('matrix-tbody').innerHTML = `
      <tr>
        <td colspan="6">
          ${UI.emptyState({
            icon: '⚠️',
            title: 'Failed to retrieve transactions',
            body: 'Make sure your PumpAI Fastapi server is running locally on http://127.0.0.1:8000'
          })}
        </td>
      </tr>
    `;
  } finally {
    fetchBtn.disabled = false;
    fetchBtn.textContent = 'Fetch Transactions 🔍';
  }
}

function renderGridRows(rows) {
  const tbody = document.getElementById('matrix-tbody');
  
  if (rows.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="6">
          ${UI.emptyState({
            icon: '⬢',
            title: 'No transaction records found',
            body: 'There are no credit sales or office expenditures recorded within this date range.'
          })}
        </td>
      </tr>
    `;
    return;
  }
  
  tbody.innerHTML = rows.map((r, idx) => {
    const isDirty = !!editedRows[r.entry_id];
    const dClass = isDirty ? 'dirty' : '';
    
    // Determine active field values
    const dateVal = editedRows[r.entry_id]?.date !== undefined ? editedRows[r.entry_id].date : r.date;
    const partyVal = editedRows[r.entry_id]?.party_name !== undefined ? editedRows[r.entry_id].party_name : r.party_name;
    const vehicleVal = editedRows[r.entry_id]?.vehicle_wheel_no !== undefined ? editedRows[r.entry_id].vehicle_wheel_no : r.vehicle_wheel_no;
    const amountVal = editedRows[r.entry_id]?.amount !== undefined ? editedRows[r.entry_id].amount : r.amount;
    const typeVal = editedRows[r.entry_id]?.type !== undefined ? editedRows[r.entry_id].type : r.type;
    const remarksVal = editedRows[r.entry_id]?.remarks !== undefined ? editedRows[r.entry_id].remarks : r.remarks;
    
    return `
      <tr id="row-${r.entry_id}" class="${dClass}" data-entry-id="${r.entry_id}" data-idx="${idx}">
        <td>
          <input class="grid-input mono" type="text" data-field="date" data-row="${idx}" data-entry-id="${r.entry_id}" value="${dateVal}" placeholder="YYYY-MM-DD">
        </td>
        <td>
          <input class="grid-input" type="text" data-field="party_name" data-row="${idx}" data-entry-id="${r.entry_id}" value="${partyVal}">
        </td>
        <td>
          <input class="grid-input" type="text" data-field="vehicle_wheel_no" data-row="${idx}" data-entry-id="${r.entry_id}" value="${vehicleVal}">
        </td>
        <td>
          <input class="grid-input mono right" type="number" step="0.01" data-field="amount" data-row="${idx}" data-entry-id="${r.entry_id}" value="${amountVal}">
        </td>
        <td>
          <input class="grid-input" type="text" data-field="type" data-row="${idx}" data-entry-id="${r.entry_id}" value="${typeVal}" placeholder="udhaar / expense">
        </td>
        <td>
          <input class="grid-input" type="text" data-field="remarks" data-row="${idx}" data-entry-id="${r.entry_id}" value="${remarksVal}">
        </td>
      </tr>
    `;
  }).join('');
  
  // Bind input grid handlers
  bindGridNavigation();

  // Attach party-name autocomplete to every party_name cell in the grid
  PartyAC.attachAll('[data-field="party_name"]');
}

function bindGridNavigation() {
  const tbody = document.getElementById('matrix-tbody');
  
  tbody.oninput = e => {
    const active = e.target;
    if (!active.classList.contains('grid-input')) return;
    
    const entryId = parseInt(active.dataset.entryId);
    const field = active.dataset.field;
    let val = active.value;
    
    // Parse numeric value for amount
    if (field === 'amount') {
      val = parseFloat(val) || 0.0;
    }
    
    // Fetch original record
    const orig = originalRows.find(r => r.entry_id === entryId);
    if (!orig) return;
    
    // Initialize edited record if not present
    if (!editedRows[entryId]) {
      editedRows[entryId] = {};
    }
    
    editedRows[entryId][field] = val;
    
    // Check if the current row has actually changed from original values
    const updated = { ...orig, ...editedRows[entryId] };
    const changed = FIELDS.some(f => {
      if (f === 'amount') {
        return Math.abs((parseFloat(updated[f]) || 0) - (parseFloat(orig[f]) || 0)) > 0.001;
      }
      return String(updated[f] || '').trim() !== String(orig[f] || '').trim();
    });
    
    const rowEl = document.getElementById(`row-${entryId}`);
    if (changed) {
      rowEl.classList.add('dirty');
    } else {
      rowEl.classList.remove('dirty');
      delete editedRows[entryId];
    }
    
    updateDirtyUI();
  };
  
  tbody.onkeydown = e => {
    const active = e.target;
    if (!active.classList.contains('grid-input')) return;
    
    const field = active.dataset.field;
    const row = parseInt(active.dataset.row);
    const fieldIdx = FIELDS.indexOf(field);
    
    let targetRow = row;
    let targetFieldIdx = fieldIdx;
    
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      targetRow = Math.max(0, row - 1);
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      targetRow = Math.min(originalRows.length - 1, row + 1);
    } else if (e.key === 'ArrowLeft' && active.selectionStart === 0) {
      e.preventDefault();
      targetFieldIdx = Math.max(0, fieldIdx - 1);
    } else if (e.key === 'ArrowRight' && active.selectionEnd === active.value.length) {
      e.preventDefault();
      targetFieldIdx = Math.min(FIELDS.length - 1, fieldIdx + 1);
    } else {
      return; // Propagate normal typing
    }
    
    const targetField = FIELDS[targetFieldIdx];
    const targetEl = tbody.querySelector(`[data-row="${targetRow}"][data-field="${targetField}"]`);
    if (targetEl) {
      targetEl.focus();
      // Select input text for instant editing
      if (targetEl.type === 'text') {
        targetEl.select();
      }
    }
  };
}

function updateDirtyUI() {
  const dirtyCount = Object.keys(editedRows).length;
  const commitBtn = document.getElementById('btn-commit');
  const dirtyPill = document.getElementById('dirty-pill');
  
  if (dirtyCount > 0) {
    commitBtn.disabled = false;
    commitBtn.textContent = `Commit Global Changes (${dirtyCount}) 💾`;
    dirtyPill.classList.remove('hide');
    document.getElementById('dirty-count').textContent = dirtyCount;
  } else {
    commitBtn.disabled = true;
    commitBtn.textContent = 'Commit Global Changes 💾';
    dirtyPill.classList.add('hide');
  }
}

function applyClientFilter() {
  const q = document.getElementById('grid-search').value.toLowerCase().trim();
  const rows = document.querySelectorAll('#matrix-tbody tr[data-entry-id]');
  
  rows.forEach(rowEl => {
    const entryId = parseInt(rowEl.dataset.entryId);
    const orig = originalRows.find(r => r.entry_id === entryId);
    if (!orig) return;
    
    // Resolve active fields
    const updated = { ...orig, ...editedRows[entryId] };
    
    const matches = FIELDS.some(f => String(updated[f] || '').toLowerCase().includes(q));
    if (matches || !q) {
      rowEl.classList.remove('hide');
    } else {
      rowEl.classList.add('hide');
    }
  });
}

async function commitGlobalChanges() {
  const dirtyCount = Object.keys(editedRows).length;
  if (dirtyCount === 0) return;
  
  if (!UI.confirmAction(`Are you sure you want to commit all ${dirtyCount} pending corrections to SQLite?`)) {
    return;
  }
  
  const commitBtn = document.getElementById('btn-commit');
  commitBtn.disabled = true;
  commitBtn.textContent = 'Saving modifications... ⏳';
  
  // Format patch payload
  const patches = Object.keys(editedRows).map(entryId => ({
    entry_id: parseInt(entryId),
    ...editedRows[entryId]
  }));
  
  try {
    const res = await fetch('http://127.0.0.1:8000/api/ledger/bulk-update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(patches)
    });
    
    if (!res.ok) throw new Error('Commit failed');
    const result = await res.json();
    
    UI.toast(`Successfully committed all ${dirtyCount} pending corrections!`, 'ok');
    
    // Update originalRows state in-memory so client values match
    originalRows = originalRows.map(orig => {
      const edit = editedRows[orig.entry_id];
      return edit ? { ...orig, ...edit } : orig;
    });
    
    // Remove dirty highlights
    document.querySelectorAll('#matrix-tbody tr.dirty').forEach(r => r.classList.remove('dirty'));
    editedRows = {};
    updateDirtyUI();
    
  } catch (err) {
    console.error(err);
    UI.toast('Commit failed. SQLite transaction rolled back.', 'bad');
  } finally {
    commitBtn.disabled = false;
    updateDirtyUI();
  }
}

render();
</script>
</body>
</html>
