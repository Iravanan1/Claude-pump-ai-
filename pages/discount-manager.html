<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Contracts · PumpAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/theme.css">
<style>
  /* Local styling overrides to match theme.css precisely */
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    gap: 16px;
  }
  @media (max-width: 900px) {
    .grid-2 {
      grid-template-columns: 1fr;
    }
  }
  .action-buttons {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }
  .table-wrap {
    margin-top: 8px;
    border: 1px solid var(--border-soft);
    border-radius: 6px;
    background: var(--bg-card);
    overflow: hidden;
  }
  .t {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .t th, .t td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border-soft);
  }
  .t th {
    background: var(--bg-sunken);
    font-weight: 500;
    color: var(--text-muted);
  }
  .t tr:last-child td {
    border-bottom: none;
  }
  .t tr:hover {
    background: rgba(255, 255, 255, 0.02);
  }
  .badge-fixed {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .badge-pct {
    background: var(--info-soft);
    color: var(--info);
  }
  .autocomplete-container {
    position: relative;
  }
</style>
</head>
<body>
<main class="main" id="main"></main>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/party-ac.js"></script>
<script>
const API_BASE = "http://localhost:8000/api";
let contracts = [];
let editingParty = null;

async function loadContracts() {
  try {
    const res = await fetch(`${API_BASE}/contracts`);
    if (!res.ok) throw new Error("Failed to load contracts from server.");
    contracts = await res.json();
    render();
  } catch (err) {
    UI.toast(err.message, "bad");
    render();
  }
}

async function saveContract(e) {
  e.preventDefault();
  const form = e.target;
  const party_name = form.party_name.value.trim();
  const discount_type = form.discount_type.value;
  const discount_value = parseFloat(form.discount_value.value);

  if (!party_name) {
    UI.toast("Please specify a valid customer party name.", "bad");
    return;
  }
  if (isNaN(discount_value) || discount_value < 0) {
    UI.toast("Discount value must be a positive number.", "bad");
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/contracts/upsert`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ party_name, discount_type, discount_value })
    });
    if (!res.ok) {
      const errData = await res.json();
      throw new Error(errData.detail || "Failed to save contract.");
    }
    UI.toast(`Contract for ${party_name} saved successfully!`, "ok");
    resetForm();
    await loadContracts();
  } catch (err) {
    UI.toast(err.message, "bad");
  }
}

async function deleteContract(partyName) {
  if (!UI.confirmAction(`Are you sure you want to delete the contract pricing profile for "${partyName}"?`)) {
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/contracts/delete`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ party_name: partyName })
    });
    if (!res.ok) throw new Error("Failed to delete contract.");
    UI.toast(`Contract for ${partyName} removed.`, "ok");
    if (editingParty === partyName) {
      resetForm();
    }
    await loadContracts();
  } catch (err) {
    UI.toast(err.message, "bad");
  }
}

function startEdit(partyName) {
  const contract = contracts.find(c => c.party_name === partyName);
  if (!contract) return;
  
  editingParty = partyName;
  
  const form = document.getElementById("contract-form");
  form.party_name.value = contract.party_name;
  form.party_name.disabled = true; // PK cannot be modified on edit
  form.discount_type.value = contract.discount_type;
  form.discount_value.value = contract.discount_value;
  
  document.getElementById("form-card-title").innerText = "Edit Contract Profile";
  document.getElementById("btn-clear").style.display = "inline-flex";
  
  // Highlight select text or focus value
  form.discount_value.focus();
}

function resetForm() {
  editingParty = null;
  const form = document.getElementById("contract-form");
  form.reset();
  form.party_name.disabled = false;
  document.getElementById("form-card-title").innerText = "Configure Contract Profile";
  document.getElementById("btn-clear").style.display = "none";
}

function render() {
  const tableRowsHtml = contracts.length === 0
    ? `<tr><td colspan="5" style="text-align:center;" class="muted">No special contracts configured yet. Add one on the left.</td></tr>`
    : contracts.map(c => {
        const typeBadgeClass = c.discount_type === "FIXED_PER_LITER" ? "badge-fixed" : "badge-pct";
        const typeLabel = c.discount_type === "FIXED_PER_LITER" ? "₹/Liter Off" : "% Off Gross";
        const valueDisplay = c.discount_type === "FIXED_PER_LITER" ? `₹${c.discount_value.toFixed(2)}` : `${c.discount_value.toFixed(2)}%`;
        const updatedDate = c.updated_at ? new Date(c.updated_at).toLocaleString('en-IN') : '—';
        return `
          <tr>
            <td class="mono">${c.party_name}</td>
            <td><span class="badge ${typeBadgeClass}">${typeLabel}</span></td>
            <td class="mono num">${valueDisplay}</td>
            <td class="muted" style="font-size:12px;">${updatedDate}</td>
            <td class="right" style="white-space:nowrap;">
              <button class="btn btn-sm ghost" onclick="startEdit('${c.party_name}')" style="padding: 2px 8px; font-size:11px;">Edit</button>
              <button class="btn btn-sm btn-ghost" onclick="deleteContract('${c.party_name}')" style="padding: 2px 6px; font-size:11px; margin-left:4px; color:var(--warn);">Delete</button>
            </td>
          </tr>
        `;
      }).join('');

  document.getElementById('main').innerHTML = `
    ${UI.pageHead({
      crumb: 'Settings',
      title: 'Customer Contracts & Pricing',
      desc: 'Define custom rate profiles for your high-volume credit clients. Pre-extraction and save pipelines automatically recalculate their debit amounts.'
    })}

    <div class="grid grid-2 mt-3">
      <div class="card">
        <div class="card-head"><h3 id="form-card-title">Configure Contract Profile</h3></div>
        <form id="contract-form" onsubmit="saveContract(event)">
          <div class="field autocomplete-container">
            <label for="party_name">Customer Party Name</label>
            <input class="input" type="text" id="party_name" name="party_name" required placeholder="Type or select client name..." autocomplete="off">
          </div>
          
          <div class="field">
            <label for="discount_type">Pricing Discount Type</label>
            <select class="select" id="discount_type" name="discount_type" required>
              <option value="FIXED_PER_LITER">Fixed Rate Reduction (₹ / Liter)</option>
              <option value="PERCENTAGE_REDUCTION">Percentage Reduction (% of gross invoice)</option>
            </select>
          </div>
          
          <div class="field">
            <label for="discount_value">Discount Value</label>
            <input class="input mono" type="number" step="0.001" min="0" id="discount_value" name="discount_value" required placeholder="e.g. 1.50">
          </div>
          
          <div class="action-buttons">
            <button class="btn btn-primary" type="submit" style="flex:1;">Save Contract Profile</button>
            <button class="btn btn-ghost" type="button" id="btn-clear" onclick="resetForm()" style="display:none;">Cancel</button>
          </div>
        </form>
      </div>

      <div class="card">
        <div class="card-head">
          <h3>Active Customer Pricing Profiles</h3>
          <span class="badge" style="margin-left:auto;">${contracts.length} configured</span>
        </div>
        <div class="table-wrap">
          <table class="t">
            <thead>
              <tr>
                <th>Customer / Account Head</th>
                <th>Discount Model</th>
                <th class="num">Benefit Value</th>
                <th>Last Modified</th>
                <th style="width: 100px;"></th>
              </tr>
            </thead>
            <tbody>
              ${tableRowsHtml}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;

  // Attach auto-complete widget
  PartyAC.attach("#party_name");
}

window.addEventListener("DOMContentLoaded", loadContracts);
</script>
</body>
</html>
