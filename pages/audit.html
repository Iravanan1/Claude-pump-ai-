<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit History · PumpAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body>
<main class="main" id="main"></main>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/accounting.js"></script>
<script src="../assets/js/ocr.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
let filterEvent = 'all';
let search = '';
let limit = 200;

function eventCategory(ev) {
  if (ev.startsWith('shift.'))    return 'shift';
  if (ev.startsWith('ocr.'))      return 'ocr';
  if (ev.startsWith('upi.'))      return 'upi';
  if (ev.startsWith('wetstock.')) return 'wetstock';
  if (ev.startsWith('credit.'))   return 'credit';
  if (ev.startsWith('expense.'))  return 'expense';
  if (ev.startsWith('store.'))    return 'system';
  return 'other';
}

function categoryBadge(cat) {
  const map = {
    shift: 'accent', ocr: 'info', upi: 'info', wetstock: 'warn',
    credit: 'accent', expense: 'warn', system: '', other: ''
  };
  return `<span class="badge ${map[cat] || ''}">${cat}</span>`;
}

function render() {
  const all = PumpStore.audit();
  // newest first
  const sorted = [...all].reverse();

  // build category counts for filter chips
  const counts = { all: sorted.length };
  sorted.forEach(e => {
    const c = eventCategory(e.event);
    counts[c] = (counts[c] || 0) + 1;
  });

  // apply filters
  let view = sorted;
  if (filterEvent !== 'all') {
    view = view.filter(e => eventCategory(e.event) === filterEvent);
  }
  if (search.trim()) {
    const q = search.toLowerCase();
    view = view.filter(e =>
      e.event.toLowerCase().includes(q) ||
      JSON.stringify(e.payload || {}).toLowerCase().includes(q)
    );
  }
  const visible = view.slice(0, limit);

  const cats = ['all','shift','ocr','upi','wetstock','credit','expense','system'];

  document.getElementById('main').innerHTML = `
    ${UI.pageHead({
      crumb: 'System',
      title: 'Audit History',
      desc: 'Immutable, append-only log of every state change. Each entry carries a deterministic state hash so historical replay can be verified.',
      actions: `<button class="btn ghost" onclick="exportJson()">Export JSON</button>`
    })}

    <div class="grid grid-3">
      <div class="kpi"><div class="kpi-label">Total entries</div><div class="kpi-value">${all.length}</div></div>
      <div class="kpi"><div class="kpi-label">First entry</div><div class="kpi-value" style="font-size:18px;">${all[0] ? new Date(all[0].at).toLocaleString('en-IN') : '\u2014'}</div></div>
      <div class="kpi"><div class="kpi-label">Last entry</div><div class="kpi-value" style="font-size:18px;">${all.length ? new Date(all[all.length-1].at).toLocaleString('en-IN') : '\u2014'}</div></div>
    </div>

    <div class="card mt-3">
      <div class="card-head"><h3>Filter</h3></div>
      <div class="row" style="gap:8px; flex-wrap:wrap; align-items:center;">
        ${cats.map(c => `
          <button class="chip ${c === filterEvent ? 'active' : ''}" onclick="setFilter('${c}')">
            ${c} <span class="chip-count">${counts[c] || 0}</span>
          </button>
        `).join('')}
        <div style="flex:1; min-width:200px;">
          <input type="text" placeholder="Search event or payload..." value="${search}"
                 oninput="setSearch(this.value)" style="width:100%;">
        </div>
      </div>
    </div>

    <div class="card mt-3">
      <div class="card-head">
        <h3>Entries</h3>
        <div class="muted" style="font-size:13px;">${view.length} matching \u00b7 showing ${visible.length}</div>
      </div>

      ${visible.length === 0
        ? UI.emptyState({ title: 'No entries match', body: 'Try a different filter or clear the search.' })
        : `<table class="table audit-table">
            <thead>
              <tr>
                <th style="width:170px;">When</th>
                <th style="width:110px;">Category</th>
                <th>Event</th>
                <th>Payload summary</th>
                <th style="width:90px;" class="num">State hash</th>
              </tr>
            </thead>
            <tbody>
              ${visible.map(e => {
                const cat = eventCategory(e.event);
                const hash = (e.payload && e.payload._hash) ? String(e.payload._hash).slice(0,8) : '\u2014';
                const summary = summarisePayload(e.payload);
                return `<tr>
                  <td class="mono" style="font-size:12px;">${new Date(e.at).toLocaleString('en-IN')}</td>
                  <td>${categoryBadge(cat)}</td>
                  <td class="mono" style="font-size:13px;">${e.event}</td>
                  <td class="muted" style="font-size:13px;">${summary}</td>
                  <td class="num mono" style="font-size:12px;">${hash}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>`
      }

      ${view.length > limit ? `
        <div class="row" style="justify-content:center; margin-top:16px;">
          <button class="btn ghost" onclick="limit += 200; render()">Show more</button>
        </div>
      ` : ''}
    </div>

    <div class="muted mt-3" style="font-size:13px; padding: 0 4px;">
      Audit entries are append-only and cannot be edited or deleted from this interface.
      They live in <span class="mono">localStorage.pumpai.audit.v1</span> and are signed with a deterministic hash of the state after each mutation.
    </div>
  `;
}

function summarisePayload(p) {
  if (!p) return '';
  const clean = { ...p };
  delete clean._hash;
  const keys = Object.keys(clean);
  if (keys.length === 0) return '';
  // Friendly inline for common shapes
  if (clean.shiftId)  return `shift ${clean.shiftId}` + (clean.operatorName ? ` \u00b7 ${clean.operatorName}` : '');
  if (clean.jobId)    return `job ${clean.jobId}` + (clean.status ? ` \u00b7 ${clean.status}` : '');
  if (clean.amount)   return `amount ${fmt.rs(clean.amount)}` + (clean.category ? ` \u00b7 ${clean.category}` : '');
  if (clean.customer) return `${clean.customer}` + (clean.amount ? ` \u00b7 ${fmt.rs(clean.amount)}` : '');
  // generic
  return keys.slice(0,3).map(k => `${k}: ${typeof clean[k] === 'object' ? '\u2026' : String(clean[k]).slice(0,40)}`).join(' \u00b7 ');
}

function setFilter(c) { filterEvent = c; render(); }
function setSearch(v) { search = v; render(); }

function exportJson() {
  const data = PumpStore.audit();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `pumpai-audit-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  UI.toast('Audit log exported');
}

window.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
