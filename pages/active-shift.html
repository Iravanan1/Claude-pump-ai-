<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Active Shift · PumpAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body>
<main class="main" id="main"></main>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/accounting.js"></script>
<script src="../assets/js/ocr.js"></script>
<script src="../assets/js/ui.js"></script>
<script>
function render() {
  const s = PumpStore.state;
  const sh = s.activeShift;

  if (!sh) {
    document.getElementById('main').innerHTML = `
      ${UI.pageHead({ crumb: 'Operations', title: 'Active Shift' })}
      <div class="card">${UI.emptyState({
        title: 'No shift currently open',
        body: '<a class="btn btn-primary mt-2" href="shift-opening.html" style="margin-top:14px;display:inline-flex;">Open new shift →</a>'
      })}</div>
    `;
    return;
  }

  const t = Acct.shiftTotals(sh);
  const anom = Acct.anomalies(sh);

  document.getElementById('main').innerHTML = `
    ${UI.pageHead({
      crumb: 'Operations · Live',
      title: 'Active shift',
      desc: `Operator <strong>${sh.operatorName}</strong> · ${sh.shiftName} · opened ${fmt.date(sh.openedAt)}`,
      actions: `
        <button class="btn btn-danger" id="abort-btn">Abort</button>
        <a class="btn btn-primary" href="reconciliation.html">Close shift →</a>
      `
    })}

    <div class="grid grid-4">
      <div class="kpi">
        <div class="kpi-label">Litres dispensed</div>
        <div class="kpi-value num">${fmt.num(t.sales.litres, 2)}<span class="unit">L</span></div>
        <div class="kpi-foot">across ${t.rows.filter(r => r.litres > 0).length} nozzles</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Expected collection</div>
        <div class="kpi-value">${fmt.rs(t.expectedRs)}</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Tenders recorded</div>
        <div class="kpi-value">${fmt.rs(t.collectedRs)}</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Variance</div>
        <div class="kpi-value" style="color: ${t.status === 'balanced' ? 'var(--ok)' : t.status === 'short' ? 'var(--bad)' : 'var(--warn)'};">
          ${t.varianceRs >= 0 ? '+' : ''}${fmt.rs(t.varianceRs)}
        </div>
        <div class="kpi-foot"><span class="badge ${t.status === 'balanced' ? 'ok' : t.status === 'short' ? 'bad' : 'warn'}"><span class="dot"></span>${t.status}</span></div>
      </div>
    </div>

    ${anom.length ? `<div class="mt-3">${anom.map(a => `<div class="alert ${a.level}"><span class="icon">⚠</span>${a.msg}</div>`).join('')}</div>` : ''}

    <div class="grid grid-2 mt-3">
      <div class="card">
        <div class="card-title"><h3>Nozzle readings</h3><small class="muted">Enter closing as you read meters</small></div>
        <div class="table-wrap">
          <table class="t">
            <thead><tr>
              <th>Nozzle</th><th class="num">Opening</th><th class="num">Closing</th><th class="num">Testing</th><th class="num">Litres</th><th class="num">Amount</th>
            </tr></thead>
            <tbody id="readings-body"></tbody>
          </table>
        </div>
        <small class="muted mt-1" style="display:block; margin-top:10px;">Testing litres are subtracted from sales. Save automatically on blur.</small>
      </div>

      <div class="card">
        <div class="card-title"><h3>Tenders collected</h3></div>
        ${tenderField('cash',   'Cash',          sh.tenders.cash)}
        ${tenderField('upi',    'UPI / QR',      sh.tenders.upi)}
        ${tenderField('card',   'Card swipe',    sh.tenders.card)}
        ${tenderField('credit', 'Credit (udhaar)', sh.tenders.credit)}
        ${tenderField('fleet',  'Fleet card',    sh.tenders.fleet)}
        <div class="divider"></div>
        <div class="row-between"><strong>Total tenders</strong><strong class="num">${fmt.rs(t.tenders.totalRs)}</strong></div>
      </div>
    </div>

    <div class="card mt-3">
      <div class="card-title">
        <h3>Expenses paid out of till</h3>
        <button class="btn btn-sm" id="add-exp">+ Add expense</button>
      </div>
      ${sh.expenses.length === 0 ? UI.emptyState({ icon: '◎', title: 'No expenses this shift' }) : `
        <div class="table-wrap">
          <table class="t">
            <thead><tr><th>Category</th><th>Note</th><th class="num">Amount</th><th></th></tr></thead>
            <tbody>
              ${sh.expenses.map((e, i) => `
                <tr>
                  <td>${e.category}</td>
                  <td class="muted">${e.note || '—'}</td>
                  <td class="num">${fmt.rs(e.amount)}</td>
                  <td class="right"><button class="btn btn-sm btn-ghost" data-rm-exp="${i}">✕</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `;

  renderReadings();
  wireAll();
}

function tenderField(key, label, value) {
  return `
    <div class="field" data-tender="${key}">
      <label>${label}</label>
      <input class="input mono" type="number" step="0.01" name="${key}" value="${value || 0}">
    </div>
  `;
}

function renderReadings() {
  const sh = PumpStore.state.activeShift;
  const body = document.getElementById('readings-body');
  body.innerHTML = sh.readings.map((r, i) => {
    const n = PumpStore.state.nozzles.find(x => x.id === r.nozzleId) || {};
    const calc = Acct.nozzleSale({ opening: r.opening, closing: r.closing || 0, testing: r.testing || 0, price: r.price });
    const bad = calc.litresGross < 0;
    return `
      <tr ${bad ? 'style="background: var(--bad-bg);"' : ''}>
        <td><strong>${n.name}</strong> <small class="muted">${n.fuel}</small></td>
        <td class="num">${fmt.num(r.opening, 2)}</td>
        <td class="num"><input class="input mono" data-r="${i}" data-k="closing" type="number" step="0.01" value="${r.closing ?? ''}" style="text-align:right; width: 130px;" placeholder="—"></td>
        <td class="num"><input class="input mono" data-r="${i}" data-k="testing" type="number" step="0.01" value="${r.testing || 0}" style="text-align:right; width: 80px;"></td>
        <td class="num" style="color:${bad ? 'var(--bad)' : 'var(--ink)'}">${calc.litres ? fmt.num(calc.litres, 2) : '—'}</td>
        <td class="num">${calc.amountRs ? fmt.rs(calc.amountRs) : '—'}</td>
      </tr>
    `;
  }).join('');

  body.querySelectorAll('input').forEach(inp => {
    inp.addEventListener('change', () => {
      PumpStore.update('shift.reading.update', s => {
        s.activeShift.readings[+inp.dataset.r][inp.dataset.k] = Number(inp.value || 0);
      }, { nozzleIdx: +inp.dataset.r, key: inp.dataset.k });
      render();
    });
  });
}

function wireAll() {
  document.querySelectorAll('[data-tender]').forEach(div => {
    const key = div.dataset.tender;
    const inp = div.querySelector('input');
    inp.addEventListener('change', () => {
      PumpStore.update('shift.tender.update', s => {
        s.activeShift.tenders[key] = Number(inp.value || 0);
      }, { key, value: inp.value });
      render();
    });
  });

  document.getElementById('add-exp').onclick = addExpense;
  document.querySelectorAll('[data-rm-exp]').forEach(b => {
    b.onclick = () => {
      const i = +b.dataset.rmExp;
      PumpStore.update('shift.expense.remove', s => {
        s.activeShift.expenses.splice(i, 1);
      }, { idx: i });
      render();
    };
  });

  document.getElementById('abort-btn').onclick = () => {
    if (!UI.confirmAction('Abort the active shift? This is logged. Use Close Shift normally instead.')) return;
    PumpStore.update('shift.abort', s => { s.activeShift = null; }, {});
    UI.toast('Shift aborted', 'bad');
    setTimeout(() => location.href = '../index.html', 400);
  };
}

function addExpense() {
  const category = prompt('Expense category (e.g., Tea, Repair, Cleaning):');
  if (!category) return;
  const amount = parseFloat(prompt('Amount (₹):'));
  if (isNaN(amount)) return;
  const note = prompt('Note (optional):') || '';
  PumpStore.update('shift.expense.add', s => {
    s.activeShift.expenses.push({
      id: 'e_' + Date.now().toString(36),
      category, amount, note,
      at: PumpStore.nowISO()
    });
  }, { category, amount });
  UI.toast('Expense added');
  render();
}

render();
</script>
</body>
</html>
