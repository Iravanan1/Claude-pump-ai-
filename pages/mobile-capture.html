<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f11">
<title>PumpAI · Mobile Capture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ── Reset & Tokens ─────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:         #0f0f11;
    --bg-card:    #17181c;
    --bg-elev:    #1e1f25;
    --border:     rgba(255,255,255,.08);
    --accent:     #4f8ef7;
    --accent-glow:rgba(79,142,247,.35);
    --success:    #22c55e;
    --success-glow:rgba(34,197,94,.35);
    --warn:       #f59e0b;
    --danger:     #ef4444;
    --txt:        #e8e9ec;
    --txt-dim:    #8b8e99;
    --r-xl:       20px;
    --r-lg:       14px;
    --r-sm:       8px;
  }

  html, body {
    height: 100%; width: 100%;
    background: var(--bg);
    color: var(--txt);
    font-family: 'Inter Tight', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    overflow: hidden;
  }

  /* ── Shell ──────────────────────────────────────────────────── */
  .shell {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top, 12px) 16px
             env(safe-area-inset-bottom, 20px) 16px;
    gap: 0;
  }

  /* ── Header ─────────────────────────────────────────────────── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 4px 10px;
    flex-shrink: 0;
  }
  .logo {
    display: flex; align-items: center; gap: 9px;
  }
  .logo-dot {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: conic-gradient(from 200deg, var(--accent), #8b5cf6, var(--accent));
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .logo-text {
    font-size: 18px; font-weight: 700; letter-spacing: -.5px;
  }
  .mode-badge {
    font-size: 11px; font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(79,142,247,.15);
    border: 1px solid rgba(79,142,247,.3);
    color: var(--accent);
    letter-spacing: .3px;
  }

  /* ── Preview Viewport ───────────────────────────────────────── */
  .preview-wrapper {
    flex: 1;
    position: relative;
    border-radius: var(--r-xl);
    overflow: hidden;
    border: 1.5px solid var(--border);
    background: #000;
    min-height: 0;
    margin: 8px 0;
  }
  #cameraPreview {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .preview-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    gap: 12px;
    pointer-events: none;
  }
  /* Corner crop guides */
  .crop-guide {
    position: absolute;
    width: 80%; height: 70%;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
  }
  .crop-guide::before, .crop-guide::after,
  .crop-guide span::before, .crop-guide span::after {
    content: '';
    position: absolute;
    width: 22px; height: 22px;
    border-color: rgba(255,255,255,.8);
    border-style: solid;
  }
  .crop-guide::before  { top: 0; left: 0;  border-width: 2px 0 0 2px; border-radius: 4px 0 0 0; }
  .crop-guide::after   { top: 0; right: 0; border-width: 2px 2px 0 0; border-radius: 0 4px 0 0; }
  .crop-guide span::before { bottom: 0; left: 0;  border-width: 0 0 2px 2px; border-radius: 0 0 0 4px; }
  .crop-guide span::after  { bottom: 0; right: 0; border-width: 0 2px 2px 0; border-radius: 0 0 4px 0; }

  /* Placeholder state (before camera granted) */
  .preview-placeholder {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px;
    background: var(--bg-card);
  }
  .preview-placeholder .ph-icon { font-size: 52px; opacity: .4; }
  .preview-placeholder .ph-text {
    font-size: 14px; color: var(--txt-dim); text-align: center;
    max-width: 200px; line-height: 1.5;
  }

  /* Result preview canvas */
  #resultCanvas {
    width: 100%; height: 100%;
    object-fit: contain;
    display: none;
    background: #000;
  }

  /* Flash effect */
  .flash {
    position: absolute; inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity .08s;
  }
  .flash.active { opacity: .85; transition: none; }

  /* ── Status Bar ─────────────────────────────────────────────── */
  .status-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    border-radius: var(--r-lg);
    background: var(--bg-card);
    border: 1px solid var(--border);
    flex-shrink: 0;
    margin-bottom: 10px;
    min-height: 48px;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--txt-dim);
  }
  .status-dot.ready   { background: var(--success); box-shadow: 0 0 8px var(--success-glow); }
  .status-dot.busy    { background: var(--warn); animation: pulse 1s infinite; }
  .status-dot.error   { background: var(--danger); }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .status-text { font-size: 13px; color: var(--txt-dim); flex: 1; }
  .status-text strong { color: var(--txt); font-weight: 600; }

  /* ── Action Row ─────────────────────────────────────────────── */
  .action-row {
    display: flex;
    gap: 12px;
    flex-shrink: 0;
    padding-bottom: 4px;
  }

  /* ── Buttons ─────────────────────────────────────────────────── */
  .btn {
    border: none; outline: none; cursor: pointer;
    border-radius: var(--r-lg);
    font-family: inherit;
    font-weight: 600;
    display: flex; align-items: center; justify-content: center;
    gap: 8px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    transition: transform .1s, box-shadow .1s;
    white-space: nowrap;
  }
  .btn:active { transform: scale(.96); }

  /* Primary: big camera shutter */
  #btnCapture {
    flex: 1;
    height: 68px;
    font-size: 18px;
    letter-spacing: -.3px;
    background: linear-gradient(135deg, var(--accent) 0%, #6366f1 100%);
    color: #fff;
    box-shadow: 0 4px 24px var(--accent-glow);
    border-radius: 18px;
  }
  #btnCapture:disabled {
    opacity: .45; pointer-events: none;
    box-shadow: none;
  }

  /* Gallery fallback pick */
  #btnGallery {
    width: 68px; height: 68px;
    background: var(--bg-elev);
    color: var(--txt);
    border: 1.5px solid var(--border);
    font-size: 22px;
    border-radius: 18px;
    flex-shrink: 0;
  }

  /* Retake (shows after capture) */
  #btnRetake {
    width: 68px; height: 68px;
    background: var(--bg-elev);
    color: var(--txt);
    border: 1.5px solid var(--border);
    font-size: 22px;
    border-radius: 18px;
    flex-shrink: 0;
    display: none;
  }

  /* Upload submit */
  #btnUpload {
    flex: 1;
    height: 68px;
    font-size: 18px;
    letter-spacing: -.3px;
    background: linear-gradient(135deg, var(--success) 0%, #16a34a 100%);
    color: #fff;
    box-shadow: 0 4px 24px var(--success-glow);
    border-radius: 18px;
    display: none;
  }
  #btnUpload:disabled {
    opacity: .45; pointer-events: none;
    box-shadow: none;
  }

  /* ── Result Card ─────────────────────────────────────────────── */
  .result-card {
    display: none;
    flex-direction: column;
    gap: 6px;
    padding: 14px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    font-size: 13px;
    flex-shrink: 0;
    max-height: 180px;
    overflow-y: auto;
    margin-bottom: 6px;
  }
  .result-card.show { display: flex; }
  .result-row { display: flex; justify-content: space-between; align-items: baseline; }
  .result-label { color: var(--txt-dim); }
  .result-value {
    font-weight: 600; font-family: 'JetBrains Mono', monospace;
    font-size: 12px; color: var(--txt);
  }
  .result-value.ok  { color: var(--success); }
  .result-value.err { color: var(--danger); }

  /* ── Hidden file input ──────────────────────────────────────── */
  #hiddenFileInput { display: none; }
  #hiddenCanvas    { display: none; }

  /* ── Spinner overlay ─────────────────────────────────────────── */
  .spinner-overlay {
    display: none;
    position: absolute; inset: 0;
    background: rgba(15,15,17,.72);
    align-items: center; justify-content: center;
    flex-direction: column; gap: 14px;
    border-radius: var(--r-xl);
    backdrop-filter: blur(4px);
  }
  .spinner-overlay.show { display: flex; }
  .spinner {
    width: 44px; height: 44px;
    border: 3px solid rgba(255,255,255,.12);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner-label { font-size: 14px; font-weight: 600; color: var(--txt); }
  .spinner-sub   { font-size: 12px; color: var(--txt-dim); }
</style>
</head>
<body>
<div class="shell" id="shell">

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <div class="logo-dot">⛽</div>
      <span class="logo-text">PumpAI</span>
    </div>
    <span class="mode-badge">📱 Mobile Capture</span>
  </header>

  <!-- Camera Preview -->
  <div class="preview-wrapper" id="previewWrapper">
    <!-- Placeholder -->
    <div class="preview-placeholder" id="previewPlaceholder">
      <div class="ph-icon">📷</div>
      <div class="ph-text">Tap the button below to open the camera and capture a register sheet</div>
    </div>

    <!-- Live camera stream -->
    <video id="cameraPreview" autoplay playsinline muted></video>

    <!-- Captured still -->
    <canvas id="resultCanvas"></canvas>

    <!-- Corner guides (visible over camera) -->
    <div class="preview-overlay">
      <div class="crop-guide" id="cropGuide" style="display:none;"><span></span></div>
    </div>

    <!-- Processing spinner -->
    <div class="spinner-overlay" id="spinnerOverlay">
      <div class="spinner"></div>
      <div class="spinner-label">Processing…</div>
      <div class="spinner-sub">AI is reading the register sheet</div>
    </div>

    <!-- Flash -->
    <div class="flash" id="flash"></div>
  </div>

  <!-- Status Bar -->
  <div class="status-bar" id="statusBar">
    <div class="status-dot" id="statusDot"></div>
    <div class="status-text" id="statusText">Tap <strong>Capture Sheet</strong> to start</div>
  </div>

  <!-- Result Card (shown after upload) -->
  <div class="result-card" id="resultCard">
    <div class="result-row">
      <span class="result-label">Date</span>
      <span class="result-value" id="rDate">—</span>
    </div>
    <div class="result-row">
      <span class="result-label">HSD Sales</span>
      <span class="result-value" id="rHsd">—</span>
    </div>
    <div class="result-row">
      <span class="result-label">MS Sales</span>
      <span class="result-value" id="rMs">—</span>
    </div>
    <div class="result-row">
      <span class="result-label">Total Cash</span>
      <span class="result-value" id="rCash">—</span>
    </div>
    <div class="result-row">
      <span class="result-label">Validation</span>
      <span class="result-value" id="rStatus">—</span>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="action-row" id="actionRow">
    <!-- Gallery fallback -->
    <button class="btn" id="btnGallery" title="Pick from gallery">🖼️</button>
    <!-- Main Capture -->
    <button class="btn" id="btnCapture" disabled>📷 &nbsp;Capture Sheet</button>
  </div>

  <!-- Post-capture action row (hidden initially) -->
  <div class="action-row" id="actionRowPost" style="display:none;">
    <button class="btn" id="btnRetake" style="display:flex;">🔄</button>
    <button class="btn" id="btnUpload" style="display:flex;">⬆️ &nbsp;Upload to Backend</button>
  </div>

</div><!-- /shell -->

<!-- Hidden elements -->
<input type="file" id="hiddenFileInput" accept="image/*" capture="environment">
<canvas id="hiddenCanvas"></canvas>

<script>
// ── Config ────────────────────────────────────────────────────────────────
// Dynamically resolve the backend host so the page works whether opened via
// LAN IP or localhost. The backend QR code redirects here via LAN IP, so
// window.location.hostname will be the LAN IP at scan time.
const BACKEND_HOST = `${window.location.protocol}//${window.location.hostname}:8000`;
const API_UPLOAD   = `${BACKEND_HOST}/api/upload`;

// ── Element refs ──────────────────────────────────────────────────────────
const video          = document.getElementById('cameraPreview');
const resultCanvas   = document.getElementById('resultCanvas');
const hiddenCanvas   = document.getElementById('hiddenCanvas');
const hiddenFileInput= document.getElementById('hiddenFileInput');
const placeholder    = document.getElementById('previewPlaceholder');
const cropGuide      = document.getElementById('cropGuide');
const statusDot      = document.getElementById('statusDot');
const statusText     = document.getElementById('statusText');
const resultCard     = document.getElementById('resultCard');
const actionRow      = document.getElementById('actionRow');
const actionRowPost  = document.getElementById('actionRowPost');
const btnCapture     = document.getElementById('btnCapture');
const btnGallery     = document.getElementById('btnGallery');
const btnUpload      = document.getElementById('btnUpload');
const btnRetake      = document.getElementById('btnRetake');
const flash          = document.getElementById('flash');
const spinnerOverlay = document.getElementById('spinnerOverlay');

// ── State ─────────────────────────────────────────────────────────────────
let stream = null;
let capturedBlob = null;
let cameraStarted = false;

// ── Status helpers ────────────────────────────────────────────────────────
function setStatus(msg, dotClass = '') {
  statusDot.className = 'status-dot ' + dotClass;
  statusText.innerHTML = msg;
}

// ── Camera initialisation ─────────────────────────────────────────────────
async function startCamera() {
  if (cameraStarted) return;
  setStatus('Requesting camera access…', 'busy');
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' }, // rear camera
        width:  { ideal: 1920 },
        height: { ideal: 1080 },
      },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();
    cameraStarted = true;
    placeholder.style.display = 'none';
    video.style.display = 'block';
    cropGuide.style.display = 'block';
    btnCapture.disabled = false;
    setStatus('<strong>Camera ready.</strong> Align the register sheet inside the guides.', 'ready');
  } catch (err) {
    setStatus(`Camera error: <strong>${err.message}</strong>. Use the gallery button instead.`, 'error');
    console.error('Camera error:', err);
  }
}

// ── Capture ───────────────────────────────────────────────────────────────
function captureFrame() {
  if (!stream) return;

  // Flash effect
  flash.classList.add('active');
  requestAnimationFrame(() => {
    flash.classList.remove('active');
  });

  // Draw frame to hidden canvas
  const w = video.videoWidth;
  const h = video.videoHeight;
  hiddenCanvas.width  = w;
  hiddenCanvas.height = h;
  const ctx = hiddenCanvas.getContext('2d');
  ctx.drawImage(video, 0, 0, w, h);

  hiddenCanvas.toBlob(blob => {
    capturedBlob = blob;

    // Show still on result canvas
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      resultCanvas.width  = img.width;
      resultCanvas.height = img.height;
      resultCanvas.getContext('2d').drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
    };
    img.src = url;

    // Stop live stream, show still
    stream.getTracks().forEach(t => t.stop());
    stream = null;
    cameraStarted = false;
    video.style.display = 'none';
    resultCanvas.style.display = 'block';
    cropGuide.style.display = 'none';

    // Switch action rows
    actionRow.style.display     = 'none';
    actionRowPost.style.display = 'flex';
    resultCard.classList.remove('show');
    setStatus('Sheet captured. <strong>Upload to backend</strong> or retake.', 'ready');
  }, 'image/jpeg', 0.92);
}

// ── Upload ────────────────────────────────────────────────────────────────
async function uploadCapture() {
  if (!capturedBlob) return;

  spinnerOverlay.classList.add('show');
  btnUpload.disabled = true;
  setStatus('Uploading to backend…', 'busy');

  const formData = new FormData();
  formData.append('image', capturedBlob, `mobile_capture_${Date.now()}.jpg`);

  try {
    const resp = await fetch(API_UPLOAD, { method: 'POST', body: formData });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();

    spinnerOverlay.classList.remove('show');

    const results = Array.isArray(data) ? data[0] : data;
    populateResult(results);
    setStatus('✅ <strong>Upload complete.</strong> Results loaded below.', 'ready');
  } catch (err) {
    spinnerOverlay.classList.remove('show');
    setStatus(`❌ Upload failed: <strong>${err.message}</strong>`, 'error');
    btnUpload.disabled = false;
    console.error('Upload error:', err);
  }
}

function populateResult(d) {
  resultCard.classList.add('show');

  document.getElementById('rDate').textContent  = d.date || '—';
  document.getElementById('rHsd').textContent   = fmt(d.total_calculated_liters_hsd) + ' L';
  document.getElementById('rMs').textContent    = fmt(d.total_calculated_liters_ms)  + ' L';
  document.getElementById('rCash').textContent  = '₹' + fmt(d.total_cash_calculated);

  const status = (d.validation_status || 'unknown').toLowerCase();
  const el = document.getElementById('rStatus');
  el.textContent = status;
  el.className   = 'result-value ' + (status === 'balanced' ? 'ok' : 'err');
}

function fmt(v) {
  const n = parseFloat(v);
  return isNaN(n) ? '—' : n.toLocaleString('en-IN', { maximumFractionDigits: 2 });
}

// ── Retake ────────────────────────────────────────────────────────────────
function retake() {
  capturedBlob = null;
  resultCanvas.style.display = 'none';
  resultCard.classList.remove('show');
  actionRowPost.style.display = 'none';
  actionRow.style.display     = 'flex';
  btnCapture.disabled         = true;
  btnUpload.disabled          = false;
  setStatus('Tap <strong>Capture Sheet</strong> to start', '');
  startCamera();
}

// ── Gallery fallback ──────────────────────────────────────────────────────
function pickFromGallery() {
  hiddenFileInput.click();
}

hiddenFileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;

  capturedBlob = file;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    resultCanvas.width  = img.naturalWidth;
    resultCanvas.height = img.naturalHeight;
    resultCanvas.getContext('2d').drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
  };
  img.src = url;

  // Stop camera if running
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.style.display    = 'none';
  resultCanvas.style.display = 'block';
  placeholder.style.display  = 'none';
  cropGuide.style.display    = 'none';

  actionRow.style.display     = 'none';
  actionRowPost.style.display = 'flex';
  setStatus('Image selected. <strong>Upload to backend</strong> or retake.', 'ready');
  hiddenFileInput.value = '';
});

// ── Event listeners ───────────────────────────────────────────────────────
btnCapture.addEventListener('click', captureFrame);
btnGallery.addEventListener('click', pickFromGallery);
btnUpload.addEventListener('click',  uploadCapture);
btnRetake.addEventListener('click',  retake);

// Auto-start camera on load
window.addEventListener('load', () => {
  // Feature-detect getUserMedia
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus('Camera API not supported. Use <strong>🖼️ Gallery</strong> to pick an image.', 'error');
    return;
  }
  startCamera();
});

// Wake lock (keep screen on while the app is active)
async function requestWakeLock() {
  if ('wakeLock' in navigator) {
    try { await navigator.wakeLock.request('screen'); } catch(_) {}
  }
}
requestWakeLock();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});
</script>
</body>
</html>
